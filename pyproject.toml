[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcsm-sdk"
version = "0.1.0"
description = "Read, extract and rebuild Minecraft: Story Mode .ttarch2 archives"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: System :: Archiving",
]

[project.optional-dependencies]
fast = ["numpy"]

[project.scripts]
mcsm = "mcsm.__main__:main"

[tool.setuptools]
packages = ["mcsm"]
